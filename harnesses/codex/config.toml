# Shared defaults for plain `codex`.
# settings-sync merges these keys into ~/.codex/config.toml.
# Keys omitted here retain their installed values, including local state.

model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
service_tier = "fast"
approval_policy = "never"
sandbox_mode = "danger-full-access"
sqlite_home = "/var/tmp/hayden.dorahy/codex-sqlite"

[features]
hooks = true
# Forces the V2 collaboration toolset (spawn_agent, followup_task, ...)
# for custom providers, whose fallback model metadata has no
# multi_agent_version. Native-metadata models (gpt-6*) are unaffected -
# they already resolve to v2. On non-OpenAI backends the tools arrive as a
# namespace tool spec the backend may drop (slurm-llm gateway drops it
# until its codex translator flattens them - see slurm-llm
# gateway/codex_compat_handler.py).
multi_agent_v2 = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "approval-mode", "context-used", "context-window-size", "estimated-thread-cost"]
status_line_use_colors = true

# Custom model provider (e.g. GLM coding plan). Codex only supports
# wire_api = "responses" - the endpoint must speak the Responses API.
# Uncomment and fill in once the endpoint is confirmed (see z.ai docs):
#
# Place model and model_provider above [features] as top-level keys.
# model = "<model-id>"
# model_provider = "glm"
#
# [model_providers.glm]
# name = "GLM"
# base_url = "<responses-api base url>"
# env_key = "ZAI_API_KEY"
# wire_api = "responses"
