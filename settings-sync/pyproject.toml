[project]
name = "settings-sync"
version = "0.1.0"
description = "Sync ~/.claude config into ~/.config/opencode and ~/.pi/agent. Single source of truth lives in ~/.claude."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tomlkit>=0.15.1",
    "typer>=0.12",
]

[project.scripts]
sync = "settings_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["settings_sync"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
