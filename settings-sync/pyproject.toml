[project]
name = "settings-sync"
version = "0.1.0"
description = "Sync shared agent rules, skills, commands, hooks, and harness settings from this source checkout into native agent homes. Single source of truth lives in this repository."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tomlkit>=0.15.1",
    "typer>=0.12",
]

[project.scripts]
agent-config = "settings_sync.cli:agent_config_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["settings_sync"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
